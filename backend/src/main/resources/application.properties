spring.application.name=recoverai

# Gemini
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/recoverai}
spring.datasource.username=${DATABASE_USERNAME:recoverai}
spring.datasource.password=${DATABASE_PASSWORD:recoverai}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Payment provider simulator
recover-ai.simulator.force-failure=${RECOVER_AI_SIMULATOR_FORCE_FAILURE:false}

