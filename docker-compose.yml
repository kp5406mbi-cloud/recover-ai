services:
  postgres:
    image: postgres:17
    container_name: recoverai-postgres
    environment:
      POSTGRES_DB: recoverai
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: