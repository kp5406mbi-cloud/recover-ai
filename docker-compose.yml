services:
  postgres:
    image: postgres:17
    container_name: recoverai-postgres
    environment:
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai
      POSTGRES_DB: recoverai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: recoverai-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/recoverai
      DATABASE_USERNAME: recoverai
      DATABASE_PASSWORD: recoverai
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-3.6-flash
      RECOVER_AI_SIMULATOR_FORCE_FAILURE: ${RECOVER_AI_SIMULATOR_FORCE_FAILURE:-false}
    depends_on:
      - postgres

volumes:
  postgres_data: